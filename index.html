<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Profesyonel ve yalın yapılacaklar listesi uygulaması.">
  <title>Hedeflerim — Görev Yöneticisi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <main class="todo-card">
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"></path>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
          </div>
          <div>
            <h1 class="app-title">Hedeflerim</h1>
            <p class="app-subtitle">Günlük Görev ve Plan Takip Paneli</p>
          </div>
        </div>
      </header>

      <section class="task-form-section">
        <form id="task-form" class="task-form" autocomplete="off">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="task-input" 
              class="task-input" 
              placeholder="Yeni bir görev veya hedef yazın (Enter ile ekleyin)..." 
              maxlength="200"
            >
            <div id="input-error" class="input-error" role="alert" aria-live="polite">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span id="input-error-text"></span>
            </div>
          </div>
          <button type="submit" id="add-btn" class="btn btn-primary" aria-label="Görevi Ekle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Ekle</span>
          </button>
        </form>
      </section>

      <section class="task-list-section">
        <div class="list-toolbar">
          <div class="filter-group" role="tablist" aria-label="Görev Filtreleri">
            <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
              Tümü <span class="filter-count" id="count-all">0</span>
            </button>
            <button type="button" class="filter-btn" data-filter="active" role="tab" aria-selected="false">
              Aktif <span class="filter-count" id="count-active">0</span>
            </button>
            <button type="button" class="filter-btn" data-filter="completed" role="tab" aria-selected="false">
              Tamamlanan <span class="filter-count" id="count-completed">0</span>
            </button>
          </div>
          <button type="button" id="clear-all-btn" class="btn btn-clear" title="Tüm görevleri listeden sil" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Tümünü Temizle</span>
          </button>
        </div>

        <ul id="task-list" class="task-list" aria-label="Görev Listesi"></ul>
      </section>

      <footer class="app-footer">
        <div class="stats-summary">
          <div class="stat-item">
            <span class="stat-label">Toplam:</span>
            <span class="stat-value" id="stat-total">0</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-label">Tamamlanan:</span>
            <span class="stat-value text-success" id="stat-completed">0</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-label">Bekleyen:</span>
            <span class="stat-value text-warning" id="stat-pending">0</span>
          </div>
        </div>
        <div class="progress-bar-wrapper" title="İlerleme Oranı">
          <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
